version: 2

models:
  - name: silver_customers
    description: One row per customer with nation, region and market segment.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        tests: [not_null, unique]
      - name: nation
        tests: [not_null]
  - name: silver_orders
    description: One row per order.
    columns:
      - name: order_id
        description: Unique order identifier.
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_customers')
                field: customer_id
      - name: order_status
        description: F = fulfilled, O = open, P = partial.
        tests:
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
  - name: silver_lineitems
    description: One row per order line.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_suppliers')
                field: supplier_id
  - name: silver_suppliers
    description: One row per supplier.
    columns:
      - name: supplier_id
        tests: [not_null, unique]
